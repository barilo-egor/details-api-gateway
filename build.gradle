plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.6'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.google.protobuf' version '0.9.6'
    id 'idea'
}

group = 'tgb.cryptoexchange'
version = '0.1-SNAPSHOT'
description = 'details-api-gateway'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
    mavenLocal()
}


dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.springframework.cloud:spring-cloud-starter-gateway-server-webflux'


    implementation platform("org.springframework.grpc:spring-grpc-dependencies:1.0.3")
    implementation 'org.springframework.grpc:spring-grpc-spring-boot-starter'
    implementation 'build.buf:protovalidate:1.2.2'
    protobuf files('build.buf:protovalidate:1.2.2')

    implementation 'commons-codec:commons-codec:1.18.0'

    implementation 'io.jsonwebtoken:jjwt:0.13.0'

    implementation 'tgb.cryptoexchange:common-api:1.1.0'
    implementation 'tgb.cryptoexchange:commons:1.0'

    implementation 'com.fasterxml.uuid:java-uuid-generator:5.2.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    compileOnly 'jakarta.annotation:jakarta.annotation-api:3.0.0'

    testImplementation 'org.wiremock.integrations:wiremock-spring-boot:4.2.1'
    testImplementation 'org.springframework.boot:spring-boot-webtestclient'
    testImplementation "org.springframework.boot:spring-boot-starter-test"
    testImplementation 'org.springframework.grpc:spring-grpc-test'
    testImplementation 'io.grpc:grpc-testing'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation "org.testcontainers:junit-jupiter:1.21.4"
    testImplementation "org.assertj:assertj-core:3.27.7"
    testImplementation 'io.projectreactor:reactor-test'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:2025.1.1"
    }
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:4.34.1"
    }
    plugins {
        grpc {
            setArtifact("io.grpc:protoc-gen-grpc-java:1.81.0")
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {
                    option 'jakarta_omit'
                }
            }
        }
    }
}

idea {
    module {
        sourceDirs += file("${projectDir}/build/extracted-include-protos/main")
        generatedSourceDirs += file("${projectDir}/build/extracted-include-protos/main")
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    systemProperty "file.encoding", "UTF-8"
}

tasks.jar {
    archiveFileName = "details-api-gateway.jar"
}

bootJar {
    archiveFileName = 'details-api-gateway.jar'
}